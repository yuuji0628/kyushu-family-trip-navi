<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>管理画面｜九州ファミリー旅ナビ</title><link rel="stylesheet" href="styles.css"></head>
<body data-page="admin" class="admin-body">
<header class="admin-header"><div class="container"><a class="brand" href="index.html"><span class="brand-mark">👨‍👩‍👧‍👦</span><span>九州ファミリー旅ナビ</span></a><a class="btn btn-small btn-ghost" href="index.html">公開サイトを見る</a></div></header>
<main class="admin-main"><div class="container admin-grid"><aside class="admin-sidebar"><strong>管理メニュー</strong><button class="admin-tab active" data-tab="dashboard">📊 ダッシュボード</button><button class="admin-tab" data-tab="editor">✏️ 記事を追加</button><button class="admin-tab" data-tab="manage">🗂️ 記事管理</button><p class="admin-note">※ この初期版はブラウザのLocalStorageに保存します。Cloudflare D1連携へ拡張可能です。</p></aside>
<section class="admin-content">
<div class="admin-panel active" id="tab-dashboard"><div class="section-head"><div><p class="eyebrow">ADMIN</p><h1>ダッシュボード</h1></div></div><div class="stat-grid"><div class="stat-card"><span>公開記事</span><strong id="statPublished">0</strong></div><div class="stat-card"><span>下書き</span><strong id="statDraft">0</strong></div><div class="stat-card"><span>登録記事</span><strong id="statTotal">0</strong></div></div><div class="admin-box"><h2>最近の記事</h2><div id="recentArticles"></div></div></div>
<div class="admin-panel" id="tab-editor"><div class="section-head"><div><p class="eyebrow">EDITOR</p><h1 id="editorTitle">新規記事作成</h1></div></div><form id="articleForm" class="admin-form"><input type="hidden" id="articleId"><label>タイトル<input id="title" required placeholder="例：別府で子連れにおすすめのホテル5選"></label><div class="form-row"><label>エリア<select id="area" required><option value="oita">大分</option><option value="fukuoka">福岡</option><option value="saga">佐賀</option><option value="nagasaki">長崎</option><option value="kumamoto">熊本</option><option value="miyazaki">宮崎</option><option value="kagoshima">鹿児島</option></select></label><label>カテゴリ<select id="category" required><option value="hotel">ホテル</option><option value="spot">観光</option><option value="gourmet">グルメ</option><option value="plan">モデルコース</option></select></label></div><label>アイキャッチ絵文字<input id="emoji" value="🏨" maxlength="4"></label><label>要約<textarea id="excerpt" rows="3" required></textarea></label><label>本文<textarea id="content" rows="12" required placeholder="見出しは ## 見出し の形式で入力できます。"></textarea></label><label class="check"><input id="published" type="checkbox" checked> 公開する</label><div class="form-actions"><button class="btn btn-primary" type="submit">保存する</button><button class="btn btn-ghost" type="button" id="resetForm">入力をリセット</button></div><p id="saveMessage" class="save-message"></p></form></div>
<div class="admin-panel" id="tab-manage"><div class="section-head"><div><p class="eyebrow">MANAGE</p><h1>記事管理</h1></div></div><div class="admin-box"><div id="manageArticles"></div></div></div>
</section></div></main><script src="app.js"></script></body></html>
